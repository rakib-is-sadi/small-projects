
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire Calculator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f4;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
#wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 2.5rem 5rem;
  position: relative;
}
#calc {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 2;
}
#screen {
  width: 228px;
  height: 68px;
  border: 1.5px solid #d1d5db;
  border-radius: 10px;
  background: #f9fafb;
  display: flex; align-items: center; justify-content: flex-end;
  padding: 0 16px;
  font-size: 28px; font-weight: 500;
  color: #111827;
  position: relative; overflow: hidden;
  transition: border-color 0.2s;
}
#screen.flash-num { border-color: #6366f1; }
#screen.flash-op  { border-color: #ef4444; }
#srip {
  position: absolute; width: 14px; height: 14px; border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0); opacity: 0;
  pointer-events: none;
}
#srip.go-num { background: rgba(99,102,241,0.3); animation: rpl 0.4s ease-out forwards; }
#srip.go-op  { background: rgba(239,68,68,0.3);  animation: rpl 0.4s ease-out forwards; }
@keyframes rpl {
  0%  { transform: translate(-50%,-50%) scale(0); opacity: 1; }
  100%{ transform: translate(-50%,-50%) scale(16); opacity: 0; }
}
#btn-grid {
  display: grid;
  grid-template-columns: repeat(4, 52px);
  gap: 10px;
}
#btn-grid .ziro {
  grid-column: span 2;
  width: 114px;
  border-radius: 20px;
}
.cb {
  width: 52px; height: 52px; border-radius: 8px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  cursor: pointer;
  font-size: 15px; font-weight: 500;
  color: #111827;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
  transition: background 0.1s;
  position: relative; z-index: 2;
}
.cb:hover { background: #f3f4f6; }
.cb.op { color: #ef4444; border-color: rgba(239,68,68,0.4); }
.cb.eq { background: #6366f1; border-color: #6366f1; color: #fff; }
.cb.eq:hover { background: #4f46e5; }
.cb.wide { width: 52px; border-radius: 8px; }
#wire-canvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 1;
}
 
/* Dark mode */
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; }
  #screen { background: #262626; border-color: #404040; color: #f5f5f5; }
  .cb { background: #262626; border-color: #404040; color: #f5f5f5; }
  .cb:hover { background: #333; }
  .cb.eq { background: #6366f1; color: #fff; }
}
</style>
</head>
<body>
 
<div id="wrap">
  <canvas id="wire-canvas"></canvas>
  <div id="calc">
    <div id="screen">
      <div id="srip"></div>
      <span id="disp">0</span>
    </div>
    <div id="btn-grid">
      <button class="cb op" data-v="C">C</button>
      <button class="cb op" data-v="+/-">±</button>
      <button class="cb op" data-v="%">%</button>
      <button class="cb op" data-v="/">÷</button>
 
      <button class="cb" data-v="7">7</button>
      <button class="cb" data-v="8">8</button>
      <button class="cb" data-v="9">9</button>
      <button class="cb op" data-v="*">×</button>
 
      <button class="cb" data-v="4">4</button>
      <button class="cb" data-v="5">5</button>
      <button class="cb" data-v="6">6</button>
      <button class="cb op" data-v="-">−</button>
 
      <button class="cb" data-v="1">1</button>
      <button class="cb" data-v="2">2</button>
      <button class="cb" data-v="3">3</button>
      <button class="cb op" data-v="+">+</button>
 
      <button class="cb wide ziro" data-v="0">0</button>
      <button class="cb" data-v=".">.</button>
      <button class="cb eq" data-v="=">=</button>
    </div>
  </div>
</div>
 
<script>
const canvas   = document.getElementById('wire-canvas');
const ctx      = canvas.getContext('2d');
const wrap     = document.getElementById('wrap');
const screenEl = document.getElementById('screen');
const srip     = document.getElementById('srip');
const disp     = document.getElementById('disp');
const btnGrid  = document.getElementById('btn-grid');
 
let expr = '', justEvaled = false;
 
function resize() {
  const wr = wrap.getBoundingClientRect();
  canvas.width  = wr.width;
  canvas.height = wr.height + 60;
  canvas.style.width  = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  drawStatic();
}
 
function relPos(el) {
  const wr = wrap.getBoundingClientRect();
  const r  = el.getBoundingClientRect();
  return {
    left:  r.left   - wr.left,
    right: r.right  - wr.left,
    top:   r.top    - wr.top,
    bottom:r.bottom - wr.top,
    cx:    r.left + r.width  / 2 - wr.left,
    cy:    r.top  + r.height / 2 - wr.top,
  };
}
 
const isDark   = () => window.matchMedia('(prefers-color-scheme:dark)').matches;
const dimColor = () => isDark() ? 'rgba(255,255,255,0.13)' : 'rgba(0,0,0,0.14)';
 
function wirePts(btn, isOp) {
  const b = relPos(btn);
  const s = relPos(screenEl);
  const MARGIN = 32;
  if (isOp) {
    return [
      { x: b.right,            y: b.cy },
      { x: s.right + MARGIN,   y: b.cy },
      { x: s.right + MARGIN,   y: s.cy },
      { x: s.right,            y: s.cy }
    ];
  } else {
    return [
      { x: b.left,             y: b.cy },
      { x: s.left - MARGIN,    y: b.cy },
      { x: s.left - MARGIN,    y: s.cy },
      { x: s.left,             y: s.cy }
    ];
  }
}
 
function strokePath(points, color, lw) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.stroke();
  [points[0], points[points.length - 1]].forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });
}
 
function drawStatic() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  btnGrid.querySelectorAll('.cb').forEach(btn => {
    const isOp = btn.classList.contains('op') || btn.classList.contains('eq');
    strokePath(wirePts(btn, isOp), dimColor(), 1.5);
  });
}
 
function animateBall(btn, isOp, onDone) {
  const color = isOp ? '#ef4444' : '#6366f1';
  const glow  = isOp ? 'rgba(239,68,68,0.55)' : 'rgba(99,102,241,0.55)';
  const pts   = wirePts(btn, isOp);
 
  const segLengths = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = pts[i+1].x - pts[i].x;
    const dy = pts[i+1].y - pts[i].y;
    segLengths.push(Math.sqrt(dx*dx + dy*dy));
  }
  const totalLen  = segLengths.reduce((a, b) => a + b, 0);
  const SPEED     = 600; // px per second
  const totalTime = (totalLen / SPEED) * 1000;
 
  let startTime = null;
 
  function frame(ts) {
    if (!startTime) startTime = ts;
    const elapsed  = ts - startTime;
    const progress = Math.min(elapsed / totalTime, 1);
 
    const travelDist = progress * totalLen;
    let covered = 0, seg = 0, localT = 0;
    for (let i = 0; i < segLengths.length; i++) {
      if (covered + segLengths[i] >= travelDist) {
        seg    = i;
        localT = (travelDist - covered) / segLengths[i];
        break;
      }
      covered += segLengths[i];
      seg = i + 1; localT = 0;
    }
    seg = Math.min(seg, pts.length - 2);
 
    const p0 = pts[seg], p1 = pts[seg + 1];
    const x  = p0.x + (p1.x - p0.x) * localT;
    const y  = p0.y + (p1.y - p0.y) * localT;
 
    drawStatic();
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle   = color;
    ctx.shadowColor = glow;
    ctx.shadowBlur  = 10;
    ctx.fill();
    ctx.restore();
 
    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      drawStatic();
      onDone();
    }
  }
  requestAnimationFrame(frame);
}
 
function onImpact(isOp) {
  const cls  = isOp ? 'flash-op'  : 'flash-num';
  const rcls = isOp ? 'go-op'     : 'go-num';
  screenEl.classList.add(cls);
  srip.className = '';
  void srip.offsetWidth;
  srip.classList.add(rcls);
  setTimeout(() => screenEl.classList.remove(cls), 350);
}
 
function applyValue(val) {
  if (val === 'C') { expr = ''; disp.textContent = '0'; justEvaled = false; return; }
  if (val === '+/-') {
    if (disp.textContent !== '0') {
      disp.textContent = disp.textContent.startsWith('-')
        ? disp.textContent.slice(1)
        : '-' + disp.textContent;
      expr = disp.textContent;
    }
    return;
  }
  if (val === '%') {
    try {
      const v = parseFloat(disp.textContent) / 100;
      disp.textContent = parseFloat(v.toFixed(10));
      expr = String(v);
    } catch(e) {}
    return;
  }
  if (val === '=') {
    try {
      const r       = Function('"use strict"; return (' + expr + ')')();
      const rounded = parseFloat(r.toFixed(10));
      disp.textContent = rounded;
      expr = String(rounded);
      justEvaled = true;
    } catch(e) { disp.textContent = 'Err'; expr = ''; }
    return;
  }
  const isOpChar = ['+', '-', '*', '/'].includes(val);
  if (justEvaled && !isOpChar) { expr = ''; justEvaled = false; }
  if (justEvaled &&  isOpChar)   justEvaled = false;
  expr += val;
  disp.textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷');
}
 
btnGrid.querySelectorAll('.cb').forEach(btn => {
  btn.addEventListener('click', () => {
    const val  = btn.dataset.v;
    const isOp = btn.classList.contains('op') || btn.classList.contains('eq');
    animateBall(btn, isOp, () => {
      onImpact(isOp);
      applyValue(val);
    });
  });
});

setTimeout(resize, 150);
window.addEventListener('resize', resize);
</script>
</body>
</html>
